<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HealthSecure - Forgot Password</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    #dff7f5,
                    transparent 30%
                ),
                #f3f9fa;
        }


        .container {
            width: 900px;
            max-width: 92%;

            display: grid;
            grid-template-columns: 45% 55%;

            background: white;

            border-radius: 25px;

            overflow: hidden;

            box-shadow:
                0 25px 70px rgba(10,48,61,0.14);
        }


        /* LEFT */

        .left {
            padding: 50px 40px;

            color: white;

            background:
                linear-gradient(
                    145deg,
                    #063943,
                    #08727a
                );
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .brand-icon {
            width: 43px;
            height: 43px;

            border-radius: 13px;

            background: rgba(255,255,255,0.14);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 21px;
        }

        .brand strong {
            font-size: 19px;
        }

        .left-content {
            margin-top: 100px;
        }

        .left-content .big-icon {
            font-size: 70px;
        }

        .left h1 {
            margin-top: 20px;

            font-size: 34px;
            line-height: 1.15;
        }

        .left h1 span {
            color: #55ddd1;
        }

        .left p {
            margin-top: 17px;

            color: rgba(255,255,255,0.65);

            font-size: 12px;
            line-height: 1.8;
        }


        /* RIGHT */

        .right {
            padding: 60px 65px;

            display: flex;
            align-items: center;
        }

        .box {
            width: 100%;
        }

        .lock-icon {
            width: 63px;
            height: 63px;

            border-radius: 18px;

            background: #e5f8f6;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;

            margin-bottom: 25px;
        }

        h2 {
            color: #123c45;
            font-size: 28px;
        }

        .subtitle {
            margin-top: 9px;

            color: #89999d;

            font-size: 12px;
            line-height: 1.7;
        }

        .input-group {
            margin-top: 28px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-size: 11px;
            font-weight: 600;

            color: #456168;
        }

        input {
            width: 100%;
            height: 50px;

            padding: 0 15px;

            border-radius: 11px;

            border: 1px solid #dce7e8;

            outline: none;

            font-family: inherit;
        }

        input:focus {
            border-color: #0b9995;

            box-shadow:
                0 0 0 4px rgba(11,153,149,0.08);
        }

        button {
            width: 100%;
            height: 51px;

            margin-top: 20px;

            border: none;
            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #087e7c,
                    #0aa49b
                );

            color: white;

            font-family: inherit;
            font-size: 12px;
            font-weight: 700;

            cursor: pointer;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 23px;

            color: #078d8b;

            text-decoration: none;

            font-size: 11px;
            font-weight: 700;
        }


        @media(max-width:700px) {

            .container {
                grid-template-columns: 1fr;
            }

            .left {
                display: none;
            }

            .right {
                padding: 45px 30px;
            }
        }

    </style>

</head>


<body>


<div class="container">


    <div class="left">

        <div class="brand">

            <div class="brand-icon">
                🛡️
            </div>

            <strong>
                HealthSecure
            </strong>

        </div>


        <div class="left-content">

            <div class="big-icon">
                🔐
            </div>

            <h1>
                Don't worry.<br>
                <span>We've got you.</span>
            </h1>

            <p>
                Reset your password securely and continue
                exploring smart health insurance predictions.
            </p>

        </div>

    </div>


    <div class="right">

        <div class="box">

            <div class="lock-icon">
                🔑
            </div>

            <h2>
                Forgot Password?
            </h2>

            <p class="subtitle">
                Enter your registered email address.
                We'll help you recover your account.
            </p>


            <form method="post" action="{{ url_for('forgot_password') }}">

            <div class="input-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    placeholder="Enter your registered email"
                >

            </div>


            <button type="submit">
                Send Reset Link →
            </button>

            </form>


            <a
                href="{{ url_for('login') }}"
                class="back"
            >
                ← Back to Login
            </a>

        </div>

    </div>

</div>



<script>

function resetPassword() {

    const email =
        document.getElementById("email").value.trim();


    if (email === "") {

        alert(
            "Please enter your email address."
        );

        return;
    }


    if (!email.includes("@")) {

        alert(
            "Please enter a valid email address."
        );

        return;
    }


    alert(
        "Password reset instructions have been sent to "
        + email
    );

}

</script>


</body>
</html>
