{% extends 'base.html' %}{% block title %}Create account | Premium Predictor{% endblock %}{% block content %}
<section class="auth-card"><p class="eyebrow">Your private workspace</p><h1>Create your account</h1><form method="post" class="auth-form">
  <label>Name<input type="text" name="name" autocomplete="name" required></label>
  <label>Email<input type="email" name="email" autocomplete="email" required></label>
  <label>Password<div class="password-control"><input type="password" name="password" minlength="8" autocomplete="new-password" required><button class="password-toggle" type="button" data-toggle-password>Show</button></div><small>Use at least 8 characters.</small></label>
  <button type="submit">Create account</button>
</form><p class="auth-foot">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></section>
{% endblock %}
